name: Phase 0 baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Check lock and installed dependency compatibility
        run: |
          uv lock --check --offline
          uv pip check
      - name: Verify installed public API, instructions and documents
        run: uv run --locked python -I scripts/verify_baseline.py
      - name: Check committed whitespace
        run: git show --format= --check HEAD
